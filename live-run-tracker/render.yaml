services:
  - type: web
    name: live-run-tracker
    runtime: docker
    rootDir: live-run-tracker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: MAPBOX_TOKEN
        sync: false
      - key: TRACKER_SECRET
        sync: false
      # Optional: mirrors a Garmin LiveTrack session onto the map.
      - key: GARMIN_LIVETRACK_URL
        sync: false
      # Where the tracker's "/" redirects: your Vercel site URL.
      - key: SITE_URL
        sync: false
