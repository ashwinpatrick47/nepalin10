services:
  - type: web
    name: live-run-tracker
    runtime: docker
    dockerfilePath: ./live-run-tracker/Dockerfile
    dockerContext: ./live-run-tracker
    # This service no longer runs the Garmin bridge at all (see the
    # separate live-run-tracker-bridge service below) — just Express +
    # Socket.IO, confirmed stable on the free 512MB tier even under real
    # load (that's exactly what proved the Garmin bridge, not this code,
    # was the thing using all the memory). No paid plan needed here.
    plan: free
    healthCheckPath: /api/location
    # CMS edits to the LiveTrack link are picked up by polling, so they shouldn't rebuild the image.
    buildFilter:
      ignoredPaths:
        - live-run-tracker/content/**
    envVars:
      - key: MAPBOX_TOKEN
        sync: false
      # Generated once here, then mirrored onto the bridge service below via
      # fromService — so the two can never drift out of sync the way two
      # independently hand-typed dashboard values can (a one-character typo
      # in either copy means the bridge's points get silently 401'd forever,
      # with zero visible symptom besides "the map just stays blank").
      - key: TRACKER_SECRET
        generateValue: true
      # Optional: mirrors a Garmin LiveTrack session onto the map.
      - key: GARMIN_LIVETRACK_URL
        sync: false
      # Where the tracker's "/" redirects: your Vercel site URL.
      - key: SITE_URL
        sync: false
      # This tracker's own deployed map URL, e.g.
      # https://live-run-tracker.onrender.com/map.html — used by the
      # run-started email's "Watch the live track" link.
      - key: TRACKER_URL
        sync: false
      # Decap CMS sign-in (a GitHub OAuth App whose callback URL is <this site>/callback).
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      # Powers /admin's "Login with password" option — lets non-technical
      # people publish a new link with just a password, no GitHub account
      # needed. Both required for that option to work.
      - key: UPDATE_PASSWORD
        sync: false
      - key: GITHUB_WRITE_TOKEN
        sync: false
      # The bridge's own public URL, e.g.
      # https://live-run-tracker-bridge.onrender.com — hit the instant a
      # link is published (see /api/update-livetrack) so publishing is the
      # only action anyone ever has to take; nobody has to run or remember
      # an external keep-alive pinger.
      - key: BRIDGE_URL
        sync: false

  # Runs ONLY the Garmin LiveTrack scraper — split out from the service
  # above on purpose (see bridge-server.js and server.js's POST
  # /api/location for the full reasoning): the headless browser this needs
  # has repeatedly OOM-crashed the whole container under real sustained
  # load, and when it was sharing a process with the public-facing map,
  # that crash took the map down for everyone watching too. Isolated here,
  # the same crash only pauses new points arriving — the map itself, served
  # entirely by the other service, is never affected.
  #
  # type: web, not worker — Render has no free tier for background workers
  # at all, only web services. This binds a trivial HTTP server (see
  # bridge-server.js) purely to qualify as one; it doesn't need to receive
  # real traffic. It will still sleep after 15 minutes with nobody
  # publishing a link — that's fine, there's nothing to track while it's
  # idle anyway. Publishing a link (above) wakes it and triggers an
  # immediate re-check itself, so no external keep-alive pinger is needed.
  - type: web
    name: live-run-tracker-bridge
    runtime: docker
    dockerfilePath: ./live-run-tracker/Dockerfile
    dockerContext: ./live-run-tracker
    dockerCommand: node bridge-server.js
    plan: free
    buildFilter:
      ignoredPaths:
        - live-run-tracker/content/**
    envVars:
      # Mirrored from the main service's own TRACKER_SECRET — see the
      # comment there. Never hand-type this one; if it's ever wrong, every
      # point this bridge finds gets silently rejected (401) with no
      # visible error, and the public map just stays empty forever.
      - key: TRACKER_SECRET
        fromService:
          name: live-run-tracker
          type: web
          envVarKey: TRACKER_SECRET
      # The main service's own public URL, e.g.
      # https://live-run-tracker.onrender.com — where this worker POSTs
      # every point it finds.
      - key: MAIN_SERVICE_URL
        sync: false
      - key: GARMIN_LIVETRACK_URL
        sync: false
