services:
  - type: web
    name: live-run-tracker
    runtime: docker
    dockerfilePath: ./live-run-tracker/Dockerfile
    dockerContext: ./live-run-tracker
    # Was "free" (512MB) — the Garmin bridge's headless Chromium genuinely
    # needs more than that under sustained real load (see garmin.js's own
    # comments). This service is Blueprint-managed, so leaving this at
    # "free" after manually upgrading via the dashboard would have let a
    # future deploy silently revert the plan back to 512MB with no one
    # touching the dashboard — this keeps the committed config in sync
    # with what's actually needed.
    plan: standard
    healthCheckPath: /api/location
    # CMS edits to the LiveTrack link are picked up by polling, so they shouldn't rebuild the image.
    buildFilter:
      ignoredPaths:
        - live-run-tracker/content/**
    envVars:
      - key: MAPBOX_TOKEN
        sync: false
      - key: TRACKER_SECRET
        sync: false
      # Optional: mirrors a Garmin LiveTrack session onto the map.
      - key: GARMIN_LIVETRACK_URL
        sync: false
      # Where the tracker's "/" redirects: your Vercel site URL.
      - key: SITE_URL
        sync: false
      # This tracker's own deployed map URL, e.g.
      # https://live-run-tracker.onrender.com/map.html — used by the
      # run-started email's "Watch the live track" link.
      - key: TRACKER_URL
        sync: false
      # Decap CMS sign-in (a GitHub OAuth App whose callback URL is <this site>/callback).
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      # Powers /admin's "Login with password" option — lets non-technical
      # people publish a new link with just a password, no GitHub account
      # needed. Both required for that option to work.
      - key: UPDATE_PASSWORD
        sync: false
      - key: GITHUB_WRITE_TOKEN
        sync: false
