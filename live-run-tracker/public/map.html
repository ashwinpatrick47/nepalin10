<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Run Tracker — Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }

  #banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: #1f9d55;
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transition: background 0.3s;
    white-space: nowrap;
  }
  #banner { display: none; } /* hidden on request; remove this line to bring the Live/stale pill back */
  #banner.stale { background: #d64545; }
  #banner.none { background: #555; }

  #stats {
    position: absolute;
    left: 12px;
    bottom: 28px;
    z-index: 10;
    display: none;
    gap: 1px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  #stats.show { display: flex; }
  #stats div { background: #111418; color: #fff; padding: 10px 16px; text-align: center; min-width: 78px; }
  #stats b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  #stats span { font-size: 0.68rem; letter-spacing: .08em; text-transform: uppercase; color: #9aa0a6; }

  #config-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    color: #ffd866;
    padding: 24px;
    text-align: center;
    z-index: 20;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .run-arrow-marker {
    width: 30px;
    height: 30px;
    /* Stacked drop-shadows at increasing blur radius is the standard CSS
       neon-glow trick — each one re-blurs the whole opaque arrow shape
       (not just its edges), so they layer into one soft bloom instead of
       a single hard-edged shadow. Keeps a touch of dark shadow underneath
       so the arrow still reads as a solid shape against the satellite
       imagery, not just a glow with no form. */
    filter:
      drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45))
      drop-shadow(0 0 4px #ff0052)
      drop-shadow(0 0 10px #ff0052)
      drop-shadow(0 0 18px rgba(255, 0, 82, 0.8));
  }

  #recenter {
    position: absolute;
    right: 16px;
    bottom: 28px;
    z-index: 10;
    display: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: #111418;
    color: #fff;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  #recenter.show { display: flex; }
  #recenter:active { background: #1f9d55; }

  #refresh {
    position: absolute;
    right: 16px;
    bottom: 84px;
    z-index: 10;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: #111418;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  #refresh:active { background: #1f9d55; }
  #refresh.spin svg { animation: refresh-spin 0.6s linear; }
  @keyframes refresh-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="banner" class="none">Waiting for location…</div>
  <div id="stats">
    <div><b id="stat-distance">—</b><span>mi</span></div>
    <div><b id="stat-pace">—</b><span>pace /mi</span></div>
    <div><b id="stat-hr">—</b><span>bpm</span></div>
  </div>
  <div id="config-error"></div>
  <button id="recenter" aria-label="Recenter on runner" title="Recenter on runner">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3" />
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
    </svg>
  </button>
  <button id="refresh" aria-label="Refresh" title="Refresh">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36" />
      <path d="M21 3v6h-6" />
    </svg>
  </button>

  <script>
    // Default view before a runner appears: south of Kathmandu, tilted and looking
    // north over real 3D terrain toward the Himalayas. [lng, lat]
    const NEPAL_CENTER = [85.3240, 27.35];
    const STALE_MS = 90 * 1000;

    const bannerEl = document.getElementById('banner');
    const configErrorEl = document.getElementById('config-error');
    const recenterEl = document.getElementById('recenter');
    const refreshEl = document.getElementById('refresh');

    let lastUpdateAt = null;
    let map = null;
    let marker = null;
    let currentTrail = [];
    let hasZoomedToRunner = false;
    // Previous marker position, used to compute the bearing the arrow points at —
    // GPS `coords.heading` is frequently null (stationary, or unsupported), so the
    // direction is derived from consecutive points instead.
    let lastPoint = null;

    function createArrowElement() {
      const el = document.createElement('div');
      el.className = 'run-arrow-marker';
      el.innerHTML =
        '<svg width="30" height="30" viewBox="0 0 24 24">' +
        '<path d="M12 1.5 L20 21 L12 16.5 L4 21 Z" fill="#ff0052" stroke="#04150a" stroke-width="1.5" stroke-linejoin="round"/>' +
        '</svg>';
      return el;
    }

    function computeBearing(lat1, lng1, lat2, lng2) {
      const toRad = (d) => (d * Math.PI) / 180;
      const toDeg = (r) => (r * 180) / Math.PI;
      const phi1 = toRad(lat1);
      const phi2 = toRad(lat2);
      const deltaLambda = toRad(lng2 - lng1);
      const y = Math.sin(deltaLambda) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function updateBanner() {
      if (lastUpdateAt === null) {
        bannerEl.textContent = 'Waiting for location…';
        bannerEl.className = 'none';
        return;
      }
      const secondsAgo = Math.round((Date.now() - lastUpdateAt) / 1000);
      const stale = Date.now() - lastUpdateAt > STALE_MS;
      bannerEl.textContent = stale
        ? `Stale — no update for ${secondsAgo}s`
        : `Live — updated ${secondsAgo}s ago`;
      bannerEl.className = stale ? 'stale' : '';
    }

    setInterval(updateBanner, 1000);

    function trailToGeoJSON(trail) {
      return {
        type: 'Feature',
        geometry: {
          type: 'LineString',
          coordinates: trail.map((p) => [p.lng, p.lat]),
        },
      };
    }

    function setMarkerPosition(lat, lng) {
      if (!marker) return;
      if (lastPoint && (lastPoint.lat !== lat || lastPoint.lng !== lng)) {
        marker.setRotation(computeBearing(lastPoint.lat, lastPoint.lng, lat, lng));
      }
      marker.setLngLat([lng, lat]);
      lastPoint = { lat, lng };
    }

    function updateTrail(trail) {
      const source = map.getSource('trail');
      if (source) {
        source.setData(trailToGeoJSON(trail));
      }
    }

    const METERS_PER_MILE = 1609.344;

    // Pace is derived from distanceMeters/timestamp deltas across the trail
    // rather than Garmin's own `speedMetersPerSec` field — that field has
    // been unreliable in practice (some LiveTrack sessions appear to return
    // it already converted toward the account's display unit despite the
    // SI-sounding name), while distanceMeters has consistently matched
    // Garmin's own distance display when checked directly. Looks back far
    // enough (at least 30s and 50m) to smooth out per-point GPS noise
    // instead of reacting to two points a couple of seconds apart.
    function paceFromTrail(p, trail) {
      if (!trail || trail.length < 2 || p.distanceMeters == null) return null;
      for (let i = trail.length - 2; i >= 0; i--) {
        const prev = trail[i];
        if (prev.distanceMeters == null || prev.timestamp == null || p.timestamp == null) continue;
        const deltaMeters = p.distanceMeters - prev.distanceMeters;
        const deltaSeconds = (p.timestamp - prev.timestamp) / 1000;
        if (deltaSeconds < 30 || deltaMeters < 50) continue;
        if (deltaMeters <= 0) return null;
        return Math.round(deltaSeconds / (deltaMeters / METERS_PER_MILE));
      }
      return null;
    }

    function updateStats(p, trail) {
      const hasStats = p.distanceMeters != null || p.heartRate != null;
      document.getElementById('stats').classList.toggle('show', hasStats);
      if (!hasStats) return;
      document.getElementById('stat-distance').textContent =
        p.distanceMeters != null ? (p.distanceMeters / METERS_PER_MILE).toFixed(2) : '—';
      document.getElementById('stat-hr').textContent = p.heartRate != null ? p.heartRate : '—';
      let pace = '—';
      const secPerMile = paceFromTrail(p, trail);
      if (secPerMile != null) {
        pace = Math.floor(secPerMile / 60) + ':' + String(secPerMile % 60).padStart(2, '0');
      }
      document.getElementById('stat-pace').textContent = pace;
    }

    function handleLocationUpdate(latest, trail) {
      if (!latest) return;
      lastUpdateAt = latest.timestamp;
      updateBanner();
      // Live socket pushes pass trail as null (currentTrail only gets the
      // new point appended further below, after this runs) — fall back to
      // the already-tracked history so pace still has something to diff
      // against instead of going blank on every single live update.
      updateStats(latest, trail && trail.length ? trail : currentTrail);

      if (!marker) {
        marker = new mapboxgl.Marker({
          element: createArrowElement(),
          rotationAlignment: 'map',
          pitchAlignment: 'map',
        })
          .setLngLat([latest.lng, latest.lat])
          .addTo(map);
        lastPoint = { lat: latest.lat, lng: latest.lng };
        recenterEl.classList.add('show');
        // If we're loading mid-run with history already in the trail, orient
        // the arrow immediately using the last two points rather than waiting
        // for the next update to give it a direction.
        if (trail && trail.length >= 2) {
          const prev = trail[trail.length - 2];
          marker.setRotation(computeBearing(prev.lat, prev.lng, latest.lat, latest.lng));
        }
      } else {
        setMarkerPosition(latest.lat, latest.lng);
      }

      if (trail && trail.length) {
        currentTrail = trail.slice();
        updateTrail(currentTrail);
      }

      if (!hasZoomedToRunner) {
        // First fix: swoop in and tilt so the 3D buildings show.
        hasZoomedToRunner = true;
        map.flyTo({ center: [latest.lng, latest.lat], zoom: 16.5, pitch: 60, duration: 2500 });
      } else {
        map.easeTo({ center: [latest.lng, latest.lat], duration: 500 });
      }
    }

    recenterEl.addEventListener('click', () => {
      if (!lastPoint || !map) return;
      map.easeTo({
        center: [lastPoint.lng, lastPoint.lat],
        // Keep the zoom the viewer chose, but pull back in if they'd
        // drifted/zoomed out far enough that the runner was the thing lost.
        zoom: Math.max(map.getZoom(), 15),
        duration: 800,
      });
    });

    refreshEl.addEventListener('click', async () => {
      refreshEl.classList.add('spin');
      try {
        const data = await fetch('/api/location').then((r) => r.json());
        if (data.latest) handleLocationUpdate(data.latest, data.trail);
      } catch (err) {
        console.error('Refresh failed', err);
      } finally {
        setTimeout(() => refreshEl.classList.remove('spin'), 600);
      }
    });

    async function init() {
      let config;
      try {
        config = await fetch('/api/config').then((r) => r.json());
      } catch (err) {
        configErrorEl.style.display = 'flex';
        configErrorEl.textContent = `Could not reach server: ${err.message}`;
        return;
      }

      if (!config.mapboxToken) {
        configErrorEl.style.display = 'flex';
        configErrorEl.textContent =
          'No Mapbox token configured. Set MAPBOX_TOKEN in the server .env file and restart the server.';
        return;
      }

      mapboxgl.accessToken = config.mapboxToken;

      map = new mapboxgl.Map({
        container: 'map',
        // Classic style, not the "Standard" family — satellite-streets-v12 still
        // exposes its layers/sources normally (getStyle().layers, a real
        // 'composite' source), which the Standard style's internal style-import
        // locks away. That's what lets the 3D building extrusion below work at
        // all: Standard Satellite has real satellite texture too, but its config
        // schema has no 3D-buildings toggle, full stop — not a setting we missed.
        style: 'mapbox://styles/mapbox/satellite-streets-v12',
        center: NEPAL_CENTER,
        zoom: 9.2,
        pitch: 72,
        bearing: 0,
      });

      map.on('load', async () => {
        // Real 3D terrain (mountains) — the imagery alone is flat; the DEM is
        // what makes ridgelines/valleys actually rise and fall in 3D.
        map.addSource('mapbox-dem', {
          type: 'raster-dem',
          url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
          tileSize: 512,
          maxzoom: 14,
        });
        map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.6 });

        // No building extrusion — fill-extrusion only has footprint + height
        // to work with, so it can only ever render as a flat-roofed box; no
        // amount of color/lighting fixes that without real building meshes
        // (not available for this route). Route is mostly rural highway
        // anyway, so satellite texture + real terrain + the trail do the work.
        // Still grabbing the label layer so the trail draws under place names.
        const labelLayerId = map
          .getStyle()
          .layers.find((l) => l.type === 'symbol' && l.layout?.['text-field'])?.id;

        map.addSource('trail', {
          type: 'geojson',
          data: trailToGeoJSON([]),
        });
        // Neon glow: four stacked line layers sharing the same source/geometry
        // — widest+most-blurred at the bottom up to a thin bright core on
        // top. A single line can't do this; `line-blur` blurs one line's
        // edges, it doesn't bloom light outward the way overlapping
        // progressively-wider soft layers do. Each one still only needs to
        // be *a* line — the stacking is what reads as a glow.
        const TRAIL_LAYOUT = { 'line-join': 'round', 'line-cap': 'round' };
        map.addLayer(
          {
            id: 'trail-glow-outer',
            type: 'line',
            source: 'trail',
            layout: TRAIL_LAYOUT,
            paint: {
              'line-color': '#ff0052',
              'line-width': 22,
              'line-blur': 20,
              'line-opacity': 0.22,
            },
          },
          labelLayerId,
        );
        map.addLayer(
          {
            id: 'trail-glow-mid',
            type: 'line',
            source: 'trail',
            layout: TRAIL_LAYOUT,
            paint: {
              'line-color': '#ff0052',
              'line-width': 12,
              'line-blur': 9,
              'line-opacity': 0.4,
            },
          },
          labelLayerId,
        );
        map.addLayer(
          {
            id: 'trail-core',
            type: 'line',
            source: 'trail',
            layout: TRAIL_LAYOUT,
            paint: {
              'line-color': '#ff0052',
              'line-width': 5,
              'line-blur': 0.5,
              'line-opacity': 1,
              'line-emissive-strength': 1,
            },
          },
          labelLayerId,
        );
        map.addLayer(
          {
            id: 'trail-hot-center',
            type: 'line',
            source: 'trail',
            layout: TRAIL_LAYOUT,
            paint: {
              // Pale pink, not pure white — a true white core reads as a
              // separate stripe down the middle rather than "this line is so
              // saturated it's blown out", which is the actual neon look.
              'line-color': '#ffc9df',
              'line-width': 1.6,
              'line-blur': 0.3,
              'line-opacity': 0.9,
              'line-emissive-strength': 1,
            },
          },
          labelLayerId,
        );

        // Load whatever the server already has, in case we're a new viewer.
        try {
          const initial = await fetch('/api/location').then((r) => r.json());
          if (initial.latest) {
            handleLocationUpdate(initial.latest, initial.trail);
          }
        } catch (err) {
          console.error('Failed to load initial location', err);
        }

        const socket = io();
        socket.on('location', (data) => {
          handleLocationUpdate(data.latest, null);
          // Trail grows incrementally: append the new point rather than refetching all 2000.
          if (data.point) {
            currentTrail.push(data.point);
            updateTrail(currentTrail);
          }
        });
      });

      updateBanner();
    }

    init();
  </script>
</body>
</html>
