backend:
  name: github
  repo: ashwinpatrick47/nepalin10
  branch: main
  # The tracker itself handles the GitHub sign-in (/auth and /callback in server.js).
  base_url: https://live-run-tracker.onrender.com
  auth_endpoint: auth

publish_mode: simple
media_folder: live-run-tracker/public/uploads
public_folder: /uploads
locale: en

collections:
  - name: tracker
    label: Live tracker
    files:
      - name: livetrack
        label: Garmin LiveTrack link
        file: live-run-tracker/content/livetrack.json
        format: json
        fields:
          - label: LiveTrack link
            name: url
            widget: string
            required: false
            hint: "Paste the share link from Garmin (https://livetrack.garmin.com/session/…/token/…). Leave empty to stop mirroring. Takes effect within about a minute of publishing."
            pattern: ['^$|^https://livetrack\.garmin\.com/session/[0-9a-fA-F-]{36}/token/[0-9A-Fa-f]{16,64}/?$', 'Must be a full Garmin LiveTrack share link']
          - label: Note (optional)
            name: note
            widget: string
            required: false
            hint: "For your own reference, e.g. whose run this is."
          - label: Event distance so far (km)
            name: distanceOffsetKm
            widget: number
            value_type: float
            default: 0
            required: false
            hint: "Garmin resets its own distance to 0 every time a new LiveTrack session starts (a new one each day), so this is what makes the map show the whole event's total instead of just today's run: it's added on top of whatever the live session currently reports. Each time you paste a new day's link, first check today's final distance on the map, then add it here before publishing. To reset the whole event's counter (e.g. starting a new event), set this back to 0 and publish — that IS the reset button, there's no separate one."

      - name: strava
        label: Strava Beacon link
        file: live-run-tracker/content/strava.json
        format: json
        fields:
          - label: Beacon link
            name: url
            widget: string
            required: false
            hint: "Paste the Beacon link Strava texts you when an activity starts (strava.com/beacon/…). Leave empty to stop mirroring. Takes effect within about a minute of publishing."
            pattern: ['^$|^https://(www\.)?strava\.com/beacon/.+$', 'Must be a Strava Beacon share link']
          - label: Note (optional)
            name: note
            widget: string
            required: false
            hint: "For your own reference, e.g. whose run this is."

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Main site
        file: src/content/site-settings.json
        format: json
        fields:
          - label: Tracking live
            name: trackingLive
            widget: boolean
            default: false
            hint: "Off: every 'Track me' link on the main site (hero button, socials, footer) shows greyed out and isn't clickable. On: they show normally and link to the map. This is baked into the site at build time, not polled like the links above — takes about 1-2 minutes after publishing for Vercel to rebuild and show the change."
