backend:
  name: github
  repo: ashwinpatrick47/nepalin10
  branch: main
  # Login is handled on the live-run-tracker service (Render), not here — see
  # live-run-tracker/server.js's /auth and /callback routes. This admin page
  # is just a second doorway to the exact same CMS: same repo, same GitHub
  # OAuth app, same login. Keep this file identical to
  # live-run-tracker/public/admin/config.yml.
  base_url: https://live-run-tracker.onrender.com
  auth_endpoint: auth

publish_mode: simple
media_folder: live-run-tracker/public/uploads
public_folder: /uploads
locale: en

collections:
  - name: tracker
    label: Live tracker
    files:
      - name: livetrack
        label: Garmin LiveTrack link
        file: live-run-tracker/content/livetrack.json
        format: json
        fields:
          - label: LiveTrack link
            name: url
            widget: string
            required: false
            hint: "Paste the share link from Garmin (https://livetrack.garmin.com/session/…/token/…). Leave empty to stop mirroring. Takes effect within about a minute of publishing."
            pattern: ['^$|^https://livetrack\.garmin\.com/session/[0-9a-fA-F-]{36}/token/[0-9A-Fa-f]{16,64}/?$', 'Must be a full Garmin LiveTrack share link']
          - label: Note (optional)
            name: note
            widget: string
            required: false
            hint: "For your own reference, e.g. whose run this is."
          - label: Event distance so far (km)
            name: distanceOffsetKm
            widget: number
            value_type: float
            default: 0
            required: false
            hint: "Normally automatic — the server carries this forward itself every time it notices a new LiveTrack link, by adding whatever the map was showing right before that moment on top of the new session's distance. This field is only a manual override: to correct a mistake, or to reset the whole event's counter (e.g. starting a new event), set it to the number you want and publish."

      - name: strava
        label: Strava Beacon link
        file: live-run-tracker/content/strava.json
        format: json
        fields:
          - label: Beacon link
            name: url
            widget: string
            required: false
            hint: "Paste the Beacon link Strava texts you when an activity starts (strava.com/beacon/…). Leave empty to stop mirroring. Takes effect within about a minute of publishing."
            pattern: ['^$|^https://(www\.)?strava\.com/beacon/.+$', 'Must be a Strava Beacon share link']
          - label: Note (optional)
            name: note
            widget: string
            required: false
            hint: "For your own reference, e.g. whose run this is."
